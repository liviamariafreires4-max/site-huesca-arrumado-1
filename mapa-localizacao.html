<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa dos pontos próximos ao Huesca Palace Hotel</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    />
    <style>
      html,
      body,
      #mapa {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #e9eef4;
        font-family: Arial, sans-serif;
      }

      .marcador {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 3px solid #fff;
        border-radius: 50% 50% 50% 0;
        background: #c76b29;
        box-shadow: 0 3px 10px rgba(15, 35, 55, 0.35);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        transform: rotate(-45deg);
      }

      .marcador span {
        transform: rotate(45deg);
      }

      .marcador-hotel {
        background: #09345e;
      }

      .leaflet-popup-content {
        width: 230px !important;
        margin: 12px;
        color: #172536;
        line-height: 1.45;
      }

      .popup-local {
        overflow: hidden;
        border-radius: 10px;
        background: #fff;
      }

      .popup-local img {
        display: block;
        width: 100%;
        height: 120px;
        border-radius: 9px;
        object-fit: cover;
      }

      .popup-local-conteudo {
        padding: 10px 4px 2px;
      }

      .leaflet-popup-content strong {
        display: block;
        margin-bottom: 3px;
        color: #09345e;
        font-size: 14px;
      }

      .leaflet-popup-content a {
        display: inline-block;
        margin-top: 7px;
        color: #09345e;
        font-weight: 700;
      }

      .mapa-erro {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 28px;
        color: #425466;
        text-align: center;
      }
    </style>
    <script defer src="js/page-reveal.js?v=20260812-4"></script>
    <link rel="stylesheet" href="css/page-reveal.css?v=20260812-4" />
  </head>
  <body>
    <section
      id="mapa"
      aria-label="Mapa interativo do Huesca Palace Hotel e de três pontos próximos"
    ></section>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"
    ></script>
    <script>
      (() => {
        "use strict";

        const elementoMapa = document.getElementById("mapa");

        if (typeof window.L === "undefined") {
          elementoMapa.innerHTML =
            '<p class="mapa-erro">Não foi possível carregar o mapa. Verifique a conexão com a internet e atualize a página.</p>';
          return;
        }

        const pontos = [
          {
            nome: "Huesca Palace Hotel",
            endereco: "Avenida Brasil, nº 550 — Centro",
            coordenadas: [-22.124364, -51.383925],
            rotulo: "H",
            hotel: true,
            imagem: "img/imagem-principal.jpeg",
            imagemAlt: "Fachada do Huesca Palace Hotel",
            link: "localizacao.html",
          },
          {
            nome: "Calçadão e centro comercial",
            endereco: "Rua Tenente Nicolau Maffei — Centro",
            coordenadas: [-22.1235398, -51.3860819],
            rotulo: "1",
            imagem: "img/cards/calcadao-centro-1.jpg",
            imagemAlt: "Calçadão e centro comercial de Presidente Prudente",
            link: "localizacao.html",
          },
          {
            nome: "Praça Nove de Julho",
            endereco: "Centro de Presidente Prudente",
            coordenadas: [-22.1231273, -51.3880659],
            rotulo: "2",
            imagem: "img/cards/praca-nove-julho-1.jpg",
            imagemAlt: "Praça Nove de Julho em Presidente Prudente",
            link: "localizacao.html",
          },
          {
            nome: "Catedral de São Sebastião",
            endereco: "Rua Ribeiro de Barros, nº 1771 — Centro",
            coordenadas: [-22.1226678, -51.3890777],
            rotulo: "3",
            imagem: "img/cards/catedral-sao-sebastiao-1.jpg",
            imagemAlt: "Catedral de São Sebastião em Presidente Prudente",
            link: "localizacao.html",
          },
        ];

        const mapa = L.map("mapa", {
          scrollWheelZoom: false,
        });

        const atribuicaoMapa =
          '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>';

        /*
          O servidor padrão de imagens do OpenStreetMap exige um Referer HTTP.
          Ao abrir o HTML por file://, o navegador não envia esse cabeçalho e
          os blocos do mapa são recusados. Nesse caso usamos um mapa vetorial
          local, mantendo os mesmos marcadores e pop-ups. No GitHub Pages, o
          mapa interativo normal continua sendo carregado.
        */
        if (window.location.protocol === "file:") {
          const limitesMapaLocal = [
            [-22.128, -51.392],
            [-22.118, -51.379],
          ];

          L.imageOverlay(
            "img/mapa-centro-prudente.svg",
            limitesMapaLocal,
            {
              alt: "Mapa do centro de Presidente Prudente",
              attribution: atribuicaoMapa,
            },
          ).addTo(mapa);

          mapa.setMaxBounds(limitesMapaLocal);
        } else {
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: atribuicaoMapa,
            maxZoom: 19,
          }).addTo(mapa);
        }

        const limites = [];

        pontos.forEach((ponto) => {
          const icone = L.divIcon({
            className: "",
            html: `<div class="marcador${ponto.hotel ? " marcador-hotel" : ""}"><span>${ponto.rotulo}</span></div>`,
            iconAnchor: [17, 34],
            iconSize: [34, 34],
            popupAnchor: [0, -34],
          });

          const conteudo = `
            <article class="popup-local">
              <img src="${ponto.imagem}" alt="${ponto.imagemAlt}" />
              <div class="popup-local-conteudo">
                <strong>${ponto.nome}</strong>
                <span>${ponto.endereco}</span><br />
                <a href="${ponto.link}" target="_top">Ver página de localização</a>
              </div>
            </article>
          `;

          const marcador = L.marker(ponto.coordenadas, {
            icon: icone,
            keyboard: true,
            title: ponto.nome,
          })
            .addTo(mapa)
            .bindPopup(conteudo, {
              maxWidth: 254,
              minWidth: 254,
            });

          let temporizadorFechamento;

          const cancelarFechamento = () => {
            window.clearTimeout(temporizadorFechamento);
          };

          const abrirPopup = () => {
            cancelarFechamento();
            marcador.openPopup();
          };

          const agendarFechamento = () => {
            cancelarFechamento();
            temporizadorFechamento = window.setTimeout(() => {
              const elementoMarcador = marcador.getElement();
              const elementoPopup = marcador.getPopup().getElement();
              const marcadorAtivo = elementoMarcador?.matches(":hover, :focus");
              const popupAtivo = elementoPopup?.matches(":hover, :focus-within");

              if (!marcadorAtivo && !popupAtivo) {
                marcador.closePopup();
              }
            }, 180);
          };

          marcador.on("mouseover", abrirPopup);
          marcador.on("mouseout", agendarFechamento);
          marcador.on("popupopen", () => {
            const elementoPopup = marcador.getPopup().getElement();

            if (elementoPopup && !elementoPopup.dataset.hoverConfigurado) {
              elementoPopup.dataset.hoverConfigurado = "true";
              elementoPopup.addEventListener("mouseenter", cancelarFechamento);
              elementoPopup.addEventListener("mouseleave", agendarFechamento);
              elementoPopup.addEventListener("focusin", cancelarFechamento);
              elementoPopup.addEventListener("focusout", agendarFechamento);
            }
          });

          const elementoMarcador = marcador.getElement();
          elementoMarcador?.addEventListener("focus", abrirPopup);
          elementoMarcador?.addEventListener("blur", agendarFechamento);

          limites.push(ponto.coordenadas);
        });

        mapa.fitBounds(limites, {
          padding: [42, 42],
          maxZoom: 16,
        });
      })();
    </script>
  </body>
</html>
